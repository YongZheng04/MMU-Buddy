<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MMUbuddy</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 20px 0;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      color: #d32f2f;
      margin-bottom: 10px;
    }
    .welcome {
      font-size: 1.8rem;
      font-weight: bold;
      border-bottom: 3px solid #000;
      display: inline-block;
      padding-bottom: 5px;
    }
    .announcements {
      text-align: center;
      margin: 30px 0;
      font-size: 1.4rem;
      color: #d32f2f;
      font-weight: bold;
    }
    .announcements::after {
      content: '';
      display: block;
      width: 80%;
      height: 3px;
      background: #d32f2f;
      margin: 10px auto;
    }
    .tile {
      background-color: #e0e0e0;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .tile:hover {
      transform: translateY(-5px);
      background-color: #d0d0d0;
    }
    .container {
      max-width: 1000px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">((( o ))) MMU</div>
    <div class="welcome">Welcome to MMU Buddy</div>
  </div>

  <!-- Announcements -->
  <div class="announcements">
    ANNOUNCEMENTS : MMU ......
  </div>

  <!-- Feature Tiles -->
  <div class="row row-cols-1 row-cols-md-3 row-cols-lg-4 g-4 justify-content-center">
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Academic<br>Programmes</a>
    </div>
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Campus<br>Maps</a>
    </div>
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Food &<br>Cafe Menu</a>
    </div>
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Emergency<br>Hotlines</a>
    </div>
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Transport<br>Schedules</a>
    </div>
    <div class="col">
      <a href="#" class="tile text-decoration-none text-dark">Lost &<br>Found</a>
    </div>
    <div class="col d-flex justify-content-center">
      <a href="#" class="tile text-decoration-none text-dark">Feedback</a>
    </div>
  </div>
</div>

<!-- Bootstrap JS (optional for future interactivity) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
